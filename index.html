<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Studio Clínico IA" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Studio Clínico IA — Diagnóstico Visual & Copiloto Especializado</title>
    <meta name="description" content="Copiloto visual clínico com Inteligência Artificial para Odontologia Biológica, Nutrologia Metabólica e Dermatologia." />
    <script>
      // Registrar Service Worker para PWA Offline e detector de atualizações
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(registration) {
            if (registration.waiting) {
              window.dispatchEvent(new CustomEvent('swUpdated', { detail: registration }));
            }
            registration.addEventListener('updatefound', function() {
              var newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    window.dispatchEvent(new CustomEvent('swUpdated', { detail: registration }));
                  }
                });
              }
            });
          }).catch(function() {});
        });
      }
      window.process = { env: {} };
    </script>
  </head>
  <body>
    <div id="root">
      <div style="padding: 40px; text-align: center; font-family: system-ui, sans-serif; color: #334155;">
        <h2 style="margin-bottom: 10px;">Iniciando Studio Clínico IA...</h2>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
