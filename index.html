<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2966/2966327.png" />
    <title>Ambulatório IA v4.5 - Offline Hybrid</title>
    <script>
      console.log("Loading Ambulatório IA v4.5 Hybrid Offline - " + new Date().getTime());
      
      // Registrar Service Worker para PWA Offline
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(registration) {
            console.log('[SW] Registrado com sucesso:', registration.scope);
          }).catch(function(err) {
            console.warn('[SW] Falha ao registrar Service Worker:', err);
          });
        });
      }
      
      // Polyfill de segurança
      window.process = { env: {} };
      
      // Captura de erros
      window.addEventListener('error', function(e) {
        const errorDiv = document.createElement('div');
        errorDiv.style.cssText = 'padding: 20px; color: #ef4444; background: #fef2f2; font-family: monospace; margin: 20px; border-radius: 8px; border: 1px solid #fecaca; z-index: 9999; position: relative;';
        errorDiv.innerHTML = '<h3>⚠️ Erro Crítico Detectado:</h3><p><strong>' + e.message + '</strong></p><pre style="overflow:auto; font-size: 12px; margin-top: 10px;">' + (e.error ? e.error.stack : '') + '</pre><p style="margin-top: 15px; color: #333;">Tire um print desta tela e mande para o desenvolvedor.</p>';
        document.body.prepend(errorDiv);
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div style="padding: 40px; text-align: center; font-family: system-ui, sans-serif; color: #334155;">
        <h2 style="margin-bottom: 10px;">Iniciando o Ambulatório IA v4.5...</h2>
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-clinical-blue mx-auto mt-4"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
