      # 💬 WhatsApp (Evolution API com Chave Mestra)
      - EVOLUTION_API_URL=https://api.makprojetosmake.com.br
      - EVOLUTION_INSTANCE_NAME=ambulatorio
      - EVOLUTION_GLOBAL_KEY=b2efa885a71ee2edf72b597df1a0ce9
      - EVOLUTION_API_KEY=b2efa885a71ee2edf72b597df1a0ce9

    command: sh -c "apk add --no-cache git && rm -rf /app_ambulatorio && git clone --depth 1 https://github.com/banzai1966/ambulatorio-ia-v4.git /app_ambulatorio && cd /app_ambulatorio && npm install --legacy-peer-deps && npm run dev"
    
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=Banzainet"
        - "traefik.http.routers.ambulatorio.rule=Host(`ambulatorio.makprojetosmake.com.br`)"
        - "traefik.http.routers.ambulatorio.priority=10"
        - "traefik.http.routers.ambulatorio.entrypoints=websecure"
        - "traefik.http.routers.ambulatorio.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.ambulatorio.service=ambulatorio"
        - "traefik.http.services.ambulatorio.loadbalancer.server.port=3000"
        - "traefik.http.services.ambulatorio.loadbalancer.passHostHeader=1"

networks:
  Banzainet:
    external: true
